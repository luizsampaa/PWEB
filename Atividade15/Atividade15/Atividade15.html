<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <link rel="stylesheet" href="Atividade15.css">
</head>
<body>

    <h2>Formulário</h2>

    <form name="nomeform" onsubmit="return validar()">

        <label>Nome:</label><br>
        <input type="text" name="nome"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Comentário:</label><br>
        <textarea name="comentario"></textarea><br><br>

        <label>Pesquisa:</label><br><br>
        <p>Primeira vez nesta página??</p><br><br>
        <input type="radio" name="pesquisa" value="sim"> Sim
        <input type="radio" name="pesquisa" value="nao"> Não
        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

    <script src="Atividade15.js"></script>

</body>
</html>
